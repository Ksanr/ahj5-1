<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Popover Demo</title>
</head>
<body>
  <div class="container" style="margin-top: 100px; text-align: center;">
    <button class="btn"
            data-popover="toggle"
            data-popover-title="Заголовок поповера"
            data-popover-content="А вот и текст, написанный мелким шрифтом.">
      Нажми на меня
    </button>
  </div>
  <!-- Скрипты подключит Webpack -->
</body>
</html>
